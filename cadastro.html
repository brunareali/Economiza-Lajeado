<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - economiza.com</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #26352b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .marca {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .marca-nome {
            color: #287a4b;
            font-size: 22px;
            font-weight: bold;
        }

        .voltar {
            color: #287a4b;
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin-bottom: 25px;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        h1 {
            color: #287a4b;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitulo {
            color: #718078;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8ded9;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #287a4b;
            box-shadow: 0 0 0 3px rgba(40, 122, 75, 0.1);
        }

        .ajuda-renda {
            color: #718078;
            font-size: 12px;
            margin-top: 7px;
            line-height: 1.4;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #287a4b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #1f633c;
        }

        .seguranca {
            margin-top: 20px;
            padding: 12px;
            background: #f0f5f1;
            border-radius: 12px;
            color: #718078;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 500px) {

            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="marca">

        <div class="logo">
            💰
        </div>

        <div class="marca-nome">
            economiza.com
        </div>

    </div>


    <a
        href="index.html"
        class="voltar"
    >
        ← Voltar
    </a>


    <h1>
        Criar minha conta 💚
    </h1>


    <p class="subtitulo">

        Primeiro vamos conhecer você
        e entender como organizar
        seu dinheiro.

    </p>


    <form onsubmit="salvarCadastro(event)">

        <div class="campo">

            <label for="nome">
                Seu nome
            </label>

            <input
                id="nome"
                type="text"
                placeholder="Ex: Maria"
                autocomplete="name"
                required
            >

        </div>


        <div class="campo">

            <label for="email">
                Seu e-mail
            </label>

            <input
                id="email"
                type="email"
                placeholder="Ex: seuemail@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="campo">

            <label for="senha">
                Crie uma senha
            </label>

            <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="new-password"
                minlength="4"
                required
            >

        </div>


        <div class="campo">

            <label for="renda">
                Quanto você ganha por mês?
            </label>

            <input
                id="renda"
                type="number"
                min="0"
                step="0.01"
                placeholder="Ex: 2500"
                inputmode="decimal"
                required
            >

            <div class="ajuda-renda">

                💡 Não se preocupe.
                Você poderá alterar sua renda depois.

            </div>

        </div>


        <button type="submit">

            Continuar →

        </button>

    </form>


    <div class="seguranca">

        🔒 Seus dados ficam salvos neste dispositivo
        para manter seu planejamento financeiro.

    </div>

</div>


<script>

/* =========================
   SALVAR CADASTRO
========================= */

function salvarCadastro(event) {

    event.preventDefault();


    const nome =
        document
            .getElementById("nome")
            .value
            .trim();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const senha =
        document
            .getElementById("senha")
            .value;


    const rendaTexto =
        document
            .getElementById("renda")
            .value
            .trim();


    const renda =
        Number(rendaTexto);


    /* =========================
       VALIDAR CAMPOS
    ========================= */

    if (
        !nome ||
        !email ||
        !senha ||
        !rendaTexto
    ) {

        alert(
            "Preencha todos os campos."
        );

        return;

    }


    /* =========================
       VALIDAR RENDA
    ========================= */

    if (
        Number.isNaN(renda) ||
        renda < 0
    ) {

        alert(
            "Digite uma renda válida."
        );

        return;

    }


    /* =========================
       CRIAR USUÁRIO
    ========================= */

    const usuario = {

        nome: nome,

        email: email,

        senha: senha,

        renda: renda

    };


    /* =========================
       SALVAR USUÁRIO
    ========================= */

    localStorage.setItem(
        "usuario",
        JSON.stringify(usuario)
    );


    /* =========================
       SALVAR RENDA
    ========================= */

    localStorage.setItem(
        "rendaMensal",
        renda.toString()
    );


    /* =========================
       CRIAR LISTA DE GASTOS
    ========================= */

    if (
        !localStorage.getItem("gastos")
    ) {

        localStorage.setItem(
            "gastos",
            JSON.stringify([])
        );

    }


    /* =========================
       IR PARA ORÇAMENTO
    ========================= */

    window.location.href =
        "orcamento.html";

}

</script>

</body>

</html>
