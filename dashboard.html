<!DOCTYPE html> <html lang="pt-BR"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Meu Dinheiro - Dashboard</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {

        background: #f5f7f5;

        color: #26352b;

        min-height: 100vh;

        padding: 20px;

    }

    .container {

        max-width: 700px;

        margin: 30px auto;

    }

    /* =========================
       TOPO
    ========================= */

    .topo {

        margin-bottom: 25px;

    }

    .topo h1 {

        color: #287a4b;

        margin-bottom: 8px;

    }

    .topo p {

        color: #718078;

        line-height: 1.5;

    }

    /* =========================
       CARDS PRINCIPAIS
    ========================= */

    .cards {

        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 15px;

        margin-bottom: 20px;

    }

    .card {

        background: white;

        padding: 22px;

        border-radius: 20px;

        box-shadow:
            0 5px 20px
            rgba(0,0,0,0.06);

    }

    .card small {

        display: block;

        color: #718078;

        margin-bottom: 8px;

    }

    .card h2 {

        color: #287a4b;

        font-size: 26px;

    }

    /* =========================
       RENDA
    ========================= */

    .renda-card {

        background: #287a4b;

        color: white;

        position: relative;

    }

    .renda-card small {

        color: white;

        opacity: 0.85;

    }

    .renda-card h2 {

        color: white;

    }

    .editar-renda {

        margin-top: 15px;

        background: white;

        color: #287a4b;

        border: none;

        padding: 10px 14px;

        border-radius: 10px;

        font-weight: bold;

        cursor: pointer;

    }

    .editar-renda:hover {

        background: #eef5f0;

    }

    /* =========================
       SALDO
    ========================= */

    .saldo {

        background: #e9f5ed;

    }

    .saldo.negativo {

        background: #fff0ee;

    }

    .saldo.negativo h2 {

        color: #c0392b;

    }

    /* =========================
       GASTOS
    ========================= */

    .gastos-card {

        margin-bottom: 20px;

    }

    .gastos-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 20px;

    }

    .gastos-header h2 {

        color: #26352b;

        font-size: 21px;

    }

    .gastos-header span {

        color: #718078;

        font-size: 14px;

    }

    /* =========================
       CATEGORIAS
    ========================= */

    .categoria {

        margin-bottom: 18px;

    }

    .categoria-topo {

        display: flex;

        justify-content: space-between;

        margin-bottom: 7px;

    }

    .categoria-nome {

        font-weight: bold;

    }

    .categoria-valor {

        color: #718078;

        font-size: 14px;

    }

    .barra {

        width: 100%;

        height: 9px;

        background: #e7ece8;

        border-radius: 20px;

        overflow: hidden;

    }

    .barra-preenchida {

        height: 100%;

        background: #287a4b;

        border-radius: 20px;

        transition: width 0.3s;

    }

    .barra-preenchida.excedida {

        background: #c0392b;

    }

    /* =========================
       BOTÕES
    ========================= */

    .botoes {

        display: grid;

        gap: 12px;

        margin-bottom: 20px;

    }

    button.acao {

        width: 100%;

        padding: 16px;

        border: none;

        border-radius: 14px;

        background: #287a4b;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

    }

    button.acao:hover {

        background: #1f633c;

    }

    button.secundario {

        background: white !important;

        color: #287a4b !important;

        border: 1px solid #287a4b !important;

    }

    button.perigo {

        background: #fff0ee !important;

        color: #c0392b !important;

        border: 1px solid #f1c5bf !important;

    }

    /* =========================
       MODAL
    ========================= */

    .modal {

        display: none;

        position: fixed;

        inset: 0;

        background:
            rgba(0,0,0,0.45);

        align-items: center;

        justify-content: center;

        padding: 20px;

        z-index: 10;

    }

    .modal.ativo {

        display: flex;

    }

    .modal-conteudo {

        background: white;

        width: 100%;

        max-width: 400px;

        padding: 25px;

        border-radius: 22px;

    }

    .modal-conteudo h2 {

        color: #287a4b;

        margin-bottom: 10px;

    }

    .modal-conteudo p {

        color: #718078;

        line-height: 1.5;

        margin-bottom: 20px;

    }

    .modal-conteudo input {

        width: 100%;

        padding: 14px;

        border: 1px solid #d8ded9;

        border-radius: 12px;

        font-size: 16px;

        margin-bottom: 15px;

    }

    .modal-conteudo input:focus {

        outline: none;

        border-color: #287a4b;

    }

    .modal-botoes {

        display: grid;

        gap: 10px;

    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 550px) {

        .cards {

            grid-template-columns: 1fr;

        }

    }

</style>

</head> <body> <div class="container">
<!-- =========================
     TOPO
========================= -->

<div class="topo">

    <h1 id="saudacao">
        Olá! 👋
    </h1>

    <p>
        Aqui está o resumo do seu dinheiro
        neste mês.
    </p>

</div>

<!-- =========================
     CARDS
========================= -->

<div class="cards">

    <!-- RENDA -->

    <div class="card renda-card">

        <small>
            Renda deste mês
        </small>

        <h2 id="renda">
            R$ 0,00
        </h2>

        <button
            class="editar-renda"
            onclick="abrirEditarRenda()"
        >
            ✏️ Editar renda
        </button>

    </div>

    <!-- GASTOS -->

    <div class="card">

        <small>
            Gastos deste mês
        </small>

        <h2 id="totalGastos">
            R$ 0,00
        </h2>

    </div>

    <!-- SALDO -->

    <div
        class="card saldo"
        id="cardSaldo"
    >

        <small>
            Saldo disponível
        </small>

        <h2 id="saldo">
            R$ 0,00
        </h2>

    </div>

    <!-- MÊS -->

    <div class="card">

        <small>
            Mês atual
        </small>

        <h2 id="mesAtual">
            -
        </h2>

    </div>

</div>

<!-- =========================
     GASTOS POR CATEGORIA
========================= -->

<div class="card gastos-card">

    <div class="gastos-header">

        <h2>
            Gastos por categoria
        </h2>

        <span id="textoCategorias">
            Este mês
        </span>

    </div>

    <div id="categorias">

        <!-- Preenchido pelo JavaScript -->

    </div>

</div>

<!-- =========================
     BOTÕES
========================= -->

<div class="botoes">

    <button
        class="acao"
        onclick="registrarGasto()"
    >
        ➕ Registrar gasto
    </button>

    <button
        class="acao secundario"
        onclick="verRegistros()"
    >
        📋 Ver registros
    </button>

    <button
        class="acao secundario"
        onclick="editarOrcamento()"
    >
        ⚙️ Editar orçamento
    </button>

    <button
        class="acao perigo"
        onclick="novoMes()"
    >
        🔄 Iniciar novo mês
    </button>

</div>

</div> <!-- ========================= MODAL EDITAR RENDA ========================= --> <div class="modal" id="modalRenda" >
<div class="modal-conteudo">

    <h2>
        Editar renda 💰
    </h2>

    <p>
        Informe quanto você recebeu
        neste mês.
    </p>

    <input
        id="novaRenda"
        type="number"
        min="0"
        step="0.01"
        placeholder="Ex: 2500"
    >

    <div class="modal-botoes">

        <button
            class="acao"
            onclick="salvarNovaRenda()"
        >
            Salvar renda
        </button>

        <button
            class="acao secundario"
            onclick="fecharEditarRenda()"
        >
            Cancelar
        </button>

    </div>

</div>

</div> <script>
/* =========================
CATEGORIAS
========================= */

const categorias = {

fixos: {
    nome: "Gastos fixos",
    icone: "🏠"
},

alimentacao: {
    nome: "Alimentação",
    icone: "🍎"
},

saude: {
    nome: "Saúde",
    icone: "🏥"
},

higiene: {
    nome: "Higiene",
    icone: "🧼"
},

lazer: {
    nome: "Lazer",
    icone: "🎮"
},

transporte: {
    nome: "Transporte",
    icone: "🚗"
},

educacao: {
    nome: "Educação",
    icone: "📚"
},

investimentos: {
    nome: "Investimentos",
    icone: "💰"
}

};

/* =========================
MOEDA
========================= */

function moeda(valor) {

return Number(valor).toLocaleString(
    "pt-BR",
    {
        style: "currency",
        currency: "BRL"
    }
);

}

/* =========================
MÊS ATUAL
========================= */

function obterMesAtual() {

const agora = new Date();

return (
    agora.getFullYear() +
    "-" +
    String(
        agora.getMonth() + 1
    ).padStart(2, "0")
);

}

/* =========================
NOME DO MÊS
========================= */

function nomeDoMes(mes) {

const partes =
    mes.split("-");

const numero =
    Number(partes[1]);

const meses = [

    "Janeiro",
    "Fevereiro",
    "Março",
    "Abril",
    "Maio",
    "Junho",
    "Julho",
    "Agosto",
    "Setembro",
    "Outubro",
    "Novembro",
    "Dezembro"

];

return (
    meses[numero - 1] +
    " " +
    partes[0]
);

}

/* =========================
USUÁRIO
========================= */

function pegarUsuario() {

const salvo =
    localStorage.getItem("usuario");

if (!salvo) {

    return null;

}

try {

    return JSON.parse(salvo);

} catch {

    return null;

}

}

/* =========================
GASTOS
========================= */

function pegarGastos() {

const salvo =
    localStorage.getItem("gastos");

if (!salvo) {

    return [];

}

try {

    const gastos =
        JSON.parse(salvo);

    return Array.isArray(gastos)
        ? gastos
        : [];

} catch {

    return [];

}

}

/* =========================
ORÇAMENTO
========================= */

function pegarOrcamento() {

const salvo =
    localStorage.getItem("orcamento");

if (!salvo) {

    return {};

}

try {

    return JSON.parse(salvo);

} catch {

    return {};

}

}

/* =========================
GASTOS DO MÊS
========================= */

function gastosDoMes() {

const mes =
    obterMesAtual();

return pegarGastos()
    .filter(function(gasto) {

        return gasto.mes === mes;

    });

}

/* =========================
TOTAL GASTO
========================= */

function calcularTotalGasto() {

return gastosDoMes()
    .reduce(function(total, gasto) {

        return total +
            (Number(gasto.valor) || 0);

    }, 0);

}

/* =========================
INICIAR DASHBOARD
========================= */

function carregarDashboard() {

const usuario =
    pegarUsuario();

/*
    Se não houver usuário,
    volta para o cadastro.
*/

if (!usuario) {

    window.location.href =
        "cadastro.html";

    return;

}

const renda =
    Number(
        localStorage.getItem(
            "rendaMensal"
        )
    ) || 0;

const totalGastos =
    calcularTotalGasto();

const saldo =
    renda - totalGastos;

/* Nome */

document
    .getElementById("saudacao")
    .textContent =
        "Olá, " +
        usuario.nome +
        "! 👋";

/* Renda */

document
    .getElementById("renda")
    .textContent =
        moeda(renda);

/* Gastos */

document
    .getElementById("totalGastos")
    .textContent =
        moeda(totalGastos);

/* Saldo */

document
    .getElementById("saldo")
    .textContent =
        moeda(saldo);

/* Mês */

const mes =
    obterMesAtual();

document
    .getElementById("mesAtual")
    .textContent =
        nomeDoMes(mes);

/* Cor do saldo */

const cardSaldo =
    document
        .getElementById("cardSaldo");

if (saldo < 0) {

    cardSaldo
        .classList.add("negativo");

} else {

    cardSaldo
        .classList.remove("negativo");

}

/* Categorias */

mostrarCategorias();

}

/* =========================
MOSTRAR CATEGORIAS
========================= */

function mostrarCategorias() {

const container =
    document.getElementById(
        "categorias"
    );

const orcamento =
    pegarOrcamento();

const gastos =
    gastosDoMes();

container.innerHTML = "";

Object.keys(categorias)
    .forEach(function(chave) {

        const info =
            categorias[chave];

        const limite =
            Number(
                orcamento[chave]
            ) || 0;

        let gasto =
            0;

        gastos.forEach(function(item) {

            if (
                item.categoria === chave
            ) {

                gasto +=
                    Number(item.valor) || 0;

            }

        });

        /*
            Se não houver orçamento
            nem gasto, ainda mostramos
            a categoria.
        */

        let porcentagem = 0;

        if (limite > 0) {

            porcentagem =
                (gasto / limite) * 100;

        }

        const porcentagemBarra =
            Math.min(
                porcentagem,
                100
            );

        const excedida =
            gasto > limite &&
            limite > 0;

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "categoria";

        div.innerHTML = `

            <div class="categoria-topo">

                <span class="categoria-nome">
                    ${info.icone}
                    ${info.nome}
                </span>

                <span class="categoria-valor">

                    ${moeda(gasto)}
                    /
                    ${moeda(limite)}

                </span>

            </div>

            <div class="barra">

                <div
                    class="barra-preenchida
                    ${excedida ? "excedida" : ""}"
                    style="
                        width:
                        ${porcentagemBarra}%;
                    "
                ></div>

            </div>

        `;

        container.appendChild(div);

    });

}

/* =========================
EDITAR RENDA
========================= */

function abrirEditarRenda() {

const renda =
    Number(
        localStorage.getItem(
            "rendaMensal"
        )
    ) || 0;

document
    .getElementById("novaRenda")
    .value = renda;

document
    .getElementById("modalRenda")
    .classList.add("ativo");

}

/* =========================
FECHAR EDITAR RENDA
========================= */

function fecharEditarRenda() {

document
    .getElementById("modalRenda")
    .classList.remove("ativo");

}

/* =========================
SALVAR NOVA RENDA
========================= */

function salvarNovaRenda() {

const campo =
    document
        .getElementById(
            "novaRenda"
        );

const renda =
    Number(campo.value);

if (
    !Number.isFinite(renda) ||
    renda < 0
) {

    alert(
        "Digite uma renda válida."
    );

    return;

}

/*
    Atualiza a renda principal.
*/

localStorage.setItem(
    "rendaMensal",
    renda.toString()
);

/*
    Atualiza também o usuário.
*/

const usuario =
    pegarUsuario();

if (usuario) {

    usuario.renda =
        renda;

    localStorage.setItem(
        "usuario",
        JSON.stringify(usuario)
    );

}

fecharEditarRenda();

carregarDashboard();

alert(
    "Renda atualizada com sucesso! 💚"
);

}

/* =========================
REGISTRAR GASTO
========================= */

function registrarGasto() {

window.location.href =
    "registrar.html";

}

/* =========================
VER REGISTROS
========================= */

function verRegistros() {

window.location.href =
    "registros.html";

}

/* =========================
EDITAR ORÇAMENTO
========================= */

function editarOrcamento() {

window.location.href =
    "orcamento.html";

}

/* =========================
NOVO MÊS
========================= */

function novoMes() {

const resposta =
    confirm(

        "Deseja iniciar um novo mês?\n\n" +

        "Seus gastos anteriores " +
        "não serão apagados.\n\n" +

        "O novo mês começará " +
        "com R$ 0,00 em gastos."

    );

if (!resposta) {

    return;

}

/*
    Não apagamos os gastos.
    Eles continuam no histórico
    identificados pelo mês.

    O sistema automaticamente
    considera somente os gastos
    do mês atual.
*/

alert(

    "Novo mês iniciado! 💚\n\n" +

    "Os registros anteriores " +
    "continuam salvos no histórico."

);

carregarDashboard();

}

/* =========================
CARREGA AO ABRIR
========================= */

carregarDashboard();

</script> </body> </html>
