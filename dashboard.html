<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Dinheiro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #26352b;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .topo {
            margin-bottom: 25px;
        }

        .topo h1 {
            color: #287a4b;
            margin-bottom: 8px;
        }

        .topo p {
            color: #718078;
        }

        .resumo {
            background: #287a4b;
            color: white;
            padding: 25px;
            border-radius: 22px;
            margin-bottom: 25px;
        }

        .resumo small {
            opacity: 0.8;
        }

        .resumo h2 {
            font-size: 32px;
            margin-top: 8px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .categoria {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icone {
            font-size: 30px;
        }

        .info {
            flex: 1;
        }

        .info h3 {
            margin-bottom: 5px;
        }

        .info p {
            color: #718078;
            font-size: 14px;
        }

        .valor {
            color: #287a4b;
            font-weight: bold;
        }

        .botao {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 15px;
            background: #287a4b;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

    </style>

</head>


<body>

<div class="container">


    <div class="topo">

        <h1>Meu Dinheiro 💚</h1>

        <p>Seu resumo financeiro deste mês.</p>

    </div>


    <div class="resumo">

        <small>Dinheiro ainda disponível</small>

        <h2>R$ 0,00</h2>

    </div>


    <div class="card">

        <div class="categoria">

            <div class="icone">🏠</div>

            <div class="info">

                <h3>Gastos fixos</h3>

                <p>Valor disponível</p>

            </div>

            <div class="valor">
                R$ 0,00
            </div>

        </div>

    </div>


    <div class="card">

        <div class="categoria">

            <div class="icone">🍎</div>

            <div class="info">

                <h3>Alimentação</h3>

                <p>Valor disponível</p>

            </div>

            <div class="valor">
                R$ 0,00
            </div>

        </div>

    </div>


    <div class="card">

        <div class="categoria">

            <div class="icone">🏥</div>

            <div class="info">

                <h3>Saúde</h3>

                <p>Valor disponível</p>

            </div>

            <div class="valor">
                R$ 0,00
            </div>

        </div>

    </div>


    <div class="card">

        <div class="categoria">

            <div class="icone">🧼</div>

            <div class="info">

                <h3>Higiene</h3>

                <p>Valor disponível</p>

            </div>

            <div class="valor">
                R$ 0,00
            </div>

        </div>

    </div>


    <div class="card">

        <div class="categoria">

            <div class="icone">🎮</div>

            <div class="info">

                <h3>Lazer</h3>

                <p>Valor disponível</p>

            </div>

            <div class="valor">
                R$ 0,00
            </div>

        </div>

    </div>


    <button class="botao">

        ➕ Registrar gasto

    </button>


</div>

</body>

</html>
