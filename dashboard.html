<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar gasto - Meu Dinheiro</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f7f5;
        color: #26352b;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 500px;
        margin: 40px auto;
    }

    .voltar {
        display: inline-block;
        color: #287a4b;
        text-decoration: none;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 22px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h1 {
        color: #287a4b;
        margin-bottom: 8px;
    }

    .subtitulo {
        color: #718078;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input,
    select {
        width: 100%;
        padding: 14px;
        border: 1px solid #d8ded9;
        border-radius: 12px;
        font-size: 16px;
        margin-bottom: 20px;
        background: white;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #287a4b;
        box-shadow: 0 0 0 3px rgba(40, 122, 75, 0.1);
    }

    button {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        background: #287a4b;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1f633c;
    }

    .disponivel {
        background: #f0f5f1;
        padding: 14px;
        border-radius: 12px;
        margin-top: -5px;
        margin-bottom: 20px;
        color: #287a4b;
        font-weight: bold;
    }

    .disponivel.negativo {
        color: #c0392b;
        background: #fff0ee;
    }

    .aviso {
        font-size: 13px;
        color: #718078;
        margin-top: -10px;
        margin-bottom: 20px;
        line-height: 1.4;
    }

</style>

</head> <body> <div class="container">
<a href="dashboard.html" class="voltar">
    ← Voltar para o resumo
</a>


<div class="card">

    <h1>Registrar gasto 💸</h1>

    <p class="subtitulo">
        Anote uma compra para acompanhar
        quanto você já gastou em cada área.
    </p>


    <label for="descricao">
        O que você comprou?
    </label>

    <input
        id="descricao"
        type="text"
        placeholder="Ex: Sabonete"
        maxlength="100"
    >


    <label for="valor">
        Quanto custou?
    </label>

    <input
        id="valor"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="Ex: 15"
        oninput="mostrarDisponivel()"
    >


    <label for="categoria">
        Qual categoria?
    </label>

    <select
        id="categoria"
        onchange="mostrarDisponivel()"
    >

        <option value="">
            Escolha uma categoria
        </option>

        <option value="fixos">
            🏠 Gastos fixos
        </option>

        <option value="alimentacao">
            🍎 Alimentação
        </option>

        <option value="saude">
            🏥 Saúde
        </option>

        <option value="higiene">
            🧼 Higiene
        </option>

        <option value="lazer">
            🎮 Lazer
        </option>

        <option value="transporte">
            🚗 Transporte
        </option>

        <option value="educacao">
            📚 Educação
        </option>

        <option value="investimentos">
            💰 Investimentos
        </option>

    </select>


    <div
        id="disponivel"
        class="disponivel"
        style="display: none;"
    >
        Disponível nesta categoria:
        R$ 0,00
    </div>


    <p class="aviso">
        O valor será descontado automaticamente
        do orçamento da categoria escolhida.
    </p>


    <button onclick="registrarGasto()">
        Registrar gasto →
    </button>

</div>

</div> <script> /* ========================= FORMATAÇÃO DE MOEDA ========================= */ function moeda(valor) { return Number(valor).toLocaleString( "pt-BR", { style: "currency", currency: "BRL" } ); } /* ========================= IDENTIFICA O MÊS ATUAL ========================= */ function mesAtual() { const agora = new Date(); return ( agora.getFullYear() + "-" + String(agora.getMonth() + 1).padStart(2, "0") ); } /* ========================= PEGA O ORÇAMENTO COMPLETO ========================= */ function pegarOrcamento() { const salvo = localStorage.getItem("orcamento"); if (!salvo) { return {}; } try { return JSON.parse(salvo); } catch (erro) { console.error( "Erro ao ler o orçamento:", erro ); return {}; } } /* ========================= PEGA O VALOR DA CATEGORIA ========================= */ function pegarValorCategoria(categoria) { const orcamento = pegarOrcamento(); return Number( orcamento[categoria] ) || 0; } /* ========================= PEGA OS GASTOS SALVOS ========================= */ function pegarGastos() { const salvo = localStorage.getItem("gastos"); if (!salvo) { return []; } try { const gastos = JSON.parse(salvo); return Array.isArray(gastos) ? gastos : []; } catch (erro) { console.error( "Erro ao ler os gastos:", erro ); return []; } } /* ========================= CALCULA QUANTO JÁ FOI GASTO ========================= */ function totalGastoCategoria(categoria) { const gastos = pegarGastos(); let total = 0; gastos.forEach(function(gasto) { if ( gasto.categoria === categoria && gasto.mes === mesAtual() ) { total += Number(gasto.valor) || 0; } }); return total; } /* ========================= MOSTRA O VALOR DISPONÍVEL ========================= */ function mostrarDisponivel() { const categoria = document.getElementById("categoria").value; const elemento = document.getElementById("disponivel"); const valorDigitado = Number( document.getElementById("valor").value ) || 0; if (!categoria) { elemento.style.display = "none"; return; } const orcamento = pegarValorCategoria(categoria); const jaGasto = totalGastoCategoria(categoria); const disponivel = orcamento - jaGasto; elemento.textContent = "Disponível nesta categoria: " + moeda(disponivel); elemento.style.display = "block"; /* Mostra vermelho se a categoria já estiver sem dinheiro. */ if (disponivel <= 0 || valorDigitado > disponivel) { elemento.classList.add("negativo"); } else { elemento.classList.remove("negativo"); } } /* ========================= REGISTRAR GASTO ========================= */ function registrarGasto() { const descricao = document .getElementById("descricao") .value .trim(); const valor = Number( document .getElementById("valor") .value ); const categoria = document .getElementById("categoria") .value; /* Validação da descrição. */ if (!descricao) { alert( "Digite o que você comprou." ); return; } /* Validação do valor. */ if ( !Number.isFinite(valor) || valor <= 0 ) { alert( "Digite um valor válido." ); return; } /* Validação da categoria. */ if (!categoria) { alert( "Escolha uma categoria." ); return; } /* Verifica o orçamento da categoria. */ const orcamento = pegarValorCategoria(categoria); /* Calcula quanto já foi gasto. */ const jaGasto = totalGastoCategoria(categoria); /* Calcula quanto ainda pode gastar. */ const disponivel = orcamento - jaGasto; /* Impede gastar mais que o orçamento da categoria. */ if (valor > disponivel) { alert( "Você não tem dinheiro suficiente " + "nessa categoria.\n\n" + "Disponível: " + moeda(disponivel) ); return; } /* Recupera os gastos existentes. */ const gastos = pegarGastos(); /* Cria um identificador único. Isso será usado futuramente para editar ou excluir o gasto. */ const novoGasto = { id: Date.now().toString() + Math.random() .toString(36) .substring(2, 9), descricao: descricao, valor: valor, categoria: categoria, data: new Date() .toLocaleDateString("pt-BR"), mes: mesAtual() }; /* Adiciona o novo gasto. */ gastos.push(novoGasto); /* Salva novamente. */ localStorage.setItem( "gastos", JSON.stringify(gastos) ); alert( "Gasto registrado com sucesso! 💚" ); /* Volta para o dashboard. */ window.location.href = "dashboard.html"; } </script> </body> </html>
