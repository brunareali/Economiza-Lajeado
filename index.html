<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>economiza.com</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #26352b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 45px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #287a4b;
            font-size: 34px;
            margin-bottom: 12px;
        }

        .subtitulo {
            color: #718078;
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #287a4b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1f633c;
        }

        .login {
            display: block;
            margin-top: 20px;
            color: #287a4b;
            font-size: 14px;
            text-decoration: none;
        }

        .login:hover {
            text-decoration: underline;
        }

        .beneficios {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e5ebe6;
            text-align: left;
        }

        .beneficio {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: #536159;
            font-size: 14px;
        }

        .beneficio:last-child {
            margin-bottom: 0;
        }

        .icone {
            font-size: 20px;
        }

        @media (max-width: 500px) {

            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            💰
        </div>

        <h1>
            economiza.com
        </h1>

        <p class="subtitulo">
            Organize seu dinheiro de forma simples,
            acompanhe seus gastos e descubra
            quanto você ainda pode gastar.
        </p>

        <button onclick="window.location.href='cadastro.html'">
            Começar agora
        </button>

        <a href="login.html" class="login">
            Já tenho uma conta
        </a>

        <div class="beneficios">

            <div class="beneficio">
                <span class="icone">📊</span>
                <span>Visualize para onde seu dinheiro está indo</span>
            </div>

            <div class="beneficio">
                <span class="icone">💰</span>
                <span>Acompanhe seu saldo e sua renda</span>
            </div>

            <div class="beneficio">
                <span class="icone">🎯</span>
                <span>Controle seus gastos por categoria</span>
            </div>

        </div>

    </div>

</body>

</html>
