<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dinheiro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #26352b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 45px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #287a4b;
            font-size: 32px;
            margin-bottom: 12px;
        }

        p {
            color: #718078;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #287a4b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1f633c;
        }

        .login {
            display: block;
            margin-top: 20px;
            color: #287a4b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">💰</div>

        <h1>Meu Dinheiro</h1>

        <p>
            Organize seu dinheiro de forma simples,
            acompanhe seus gastos e saiba quanto
            você ainda pode gastar.
        </p>

        <button onclick="window.location.href='cadastro.html'">
    Criar minha conta
</button>


        <span class="login">
            Já tenho uma conta
        </span>

    </div>

</body>
</html>
