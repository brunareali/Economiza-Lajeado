<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu orçamento - Meu Dinheiro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #26352b;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
        }

        .topo {
            margin-bottom: 25px;
        }

        .topo h1 {
            color: #287a4b;
            margin-bottom: 8px;
        }

        .topo p {
            color: #718078;
            line-height: 1.5;
        }

        .renda {
            background: #287a4b;
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .renda small {
            display: block;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .renda h2 {
            font-size: 32px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .categoria {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .icone {
            font-size: 25px;
            width: 40px;
        }

        .categoria input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d8ded9;
            border-radius: 10px;
            font-size: 16px;
        }

        .total {
            background: #f0f5f1;
            padding: 18px;
            border-radius: 14px;
            margin-top: 20px;
        }

        .total strong {
            color: #287a4b;
        }

        .disponivel {
            margin-top: 10px;
        }

        .alerta {
            color: #c0392b !important;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #287a4b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1f633c;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="topo">

        <h1>Vamos organizar seu dinheiro 💚</h1>

        <p>
            Agora escolha quanto você quer reservar
            para cada área da sua vida.
        </p>

    </div>

    <div class="renda">

        <small>Sua renda mensal</small>

        <h2 id="rendaExibida">R$ 0,00</h2>

    </div>

    <div class="card">

        <h2>Quanto você quer reservar?</h2>

        <div class="categoria">
            <div class="icone">🏠</div>
            <input
                type="number"
                id="fixos"
                placeholder="Gastos fixos"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="categoria">
            <div class="icone">🍎</div>
            <input
                type="number"
                id="alimentacao"
                placeholder="Alimentação"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="categoria">
            <div class="icone">🏥</div>
            <input
                type="number"
                id="saude"
                placeholder="Saúde"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="categoria">
            <div class="icone">🧼</div>
            <input
                type="number"
                id="higiene"
                placeholder="Higiene"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="categoria">
            <div class="icone">🎮</div>
            <input
                type="number"
                id="lazer"
                placeholder="Lazer"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="categoria">
            <div class="icone">🚗</div>
            <input
                type="number"
                id="transporte"
                placeholder="Transporte"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="categoria">
            <div class="icone">📚</div>
            <input
                type="number"
                id="educacao"
                placeholder="Educação"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="categoria">
            <div class="icone">💰</div>
            <input
                type="number"
                id="investimentos"
                placeholder="Investimentos"
                oninput="calcularOrcamento()"
            >
        </div>

        <div class="total">

            <div>
                Total distribuído:
                <strong id="totalDistribuido">R$ 0,00</strong>
            </div>

            <div class="disponivel">
                Ainda disponível:
                <strong id="valorDisponivel">R$ 0,00</strong>
            </div>

        </div>

    </div>

    <button onclick="criarOrcamento()">
        Criar meu orçamento →
    </button>

</div>


<script>

const rendaSalva = localStorage.getItem("rendaMensal");

const renda = Number(rendaSalva);

document.getElementById("rendaExibida").textContent =
    renda.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });


function formatarMoeda(valor) {

    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });

}


function pegarValor(id) {

    return Number(document.getElementById(id).value) || 0;

}


function calcularOrcamento() {

    const total =
        pegarValor("fixos") +
        pegarValor("alimentacao") +
        pegarValor("saude") +
        pegarValor("higiene") +
        pegarValor("lazer") +
        pegarValor("transporte") +
        pegarValor("educacao") +
        pegarValor("investimentos");

    const disponivel = renda - total;


    document.getElementById("totalDistribuido").textContent =
        formatarMoeda(total);

    document.getElementById("valorDisponivel").textContent =
        formatarMoeda(disponivel);


    if (disponivel < 0) {

        document.getElementById("valorDisponivel")
            .classList.add("alerta");

    } else {

        document.getElementById("valorDisponivel")
            .classList.remove("alerta");

    }

}


function criarOrcamento() {

    const total =
        pegarValor("fixos") +
        pegarValor("alimentacao") +
        pegarValor("saude") +
        pegarValor("higiene") +
        pegarValor("lazer") +
        pegarValor("transporte") +
        pegarValor("educacao") +
        pegarValor("investimentos");


    if (total > renda) {

        alert(
            "Você está tentando distribuir mais dinheiro do que sua renda mensal."
        );

        return;

    }


    alert("Orçamento criado com sucesso! 💚");

}

</script>

</body>

</html>
