<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Dinheiro - Registrar Gasto</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            background: #f5f7f5;

            color: #26352b;

            min-height: 100vh;

            padding: 20px;

        }

        .container {

            max-width: 600px;

            margin: 30px auto;

        }

        .topo {

            margin-bottom: 25px;

        }

        .topo h1 {

            color: #287a4b;

            margin-bottom: 8px;

        }

        .topo p {

            color: #718078;

            line-height: 1.5;

        }

        .card {

            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);

            margin-bottom: 20px;

        }

        .periodo {

            background: #e9f5ed;

            color: #287a4b;

            padding: 14px;

            border-radius: 13px;

            line-height: 1.5;

            margin-bottom: 20px;

            font-size: 14px;

        }

        .campo {

            margin-bottom: 18px;

        }

        .campo label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #26352b;

        }

        .campo input,

        .campo select,

        .campo textarea {

            width: 100%;

            padding: 14px;

            border: 1px solid #d8ded9;

            border-radius: 12px;

            font-size: 16px;

            background: white;

            color: #26352b;

        }

        .campo textarea {

            resize: vertical;

            min-height: 90px;

        }

        .campo input:focus,

        .campo select:focus,

        .campo textarea:focus {

            outline: none;

            border-color: #287a4b;

        }

        .valor-input {

            font-size: 20px !important;

            font-weight: bold;

        }

        .botoes {

            display: grid;

            gap: 12px;

        }

        button {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 14px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .botao-salvar {

            background: #287a4b;

            color: white;

        }

        .botao-salvar:hover {

            background: #1f633c;

        }

        .botao-voltar {

            background: white;

            color: #287a4b;

            border: 1px solid #287a4b;

        }

        .mensagem {

            display: none;

            padding: 14px;

            border-radius: 12px;

            margin-bottom: 20px;

            line-height: 1.5;

        }

        .mensagem.sucesso {

            display: block;

            background: #e9f5ed;

            color: #287a4b;

        }

        .mensagem.erro {

            display: block;

            background: #fff0ee;

            color: #c0392b;

        }

        .categoria-info {

            color: #718078;

            font-size: 13px;

            margin-top: 7px;

        }

        @media (max-width: 550px) {

            .container {

                margin-top: 15px;

            }

            .card {

                padding: 20px;

            }

        }

    </style>

</head>

<body>

<div class="container">


    <div class="topo">

        <h1>
            ➕ Registrar gasto
        </h1>

        <p>
            Registre um novo gasto no seu período financeiro atual.
        </p>

    </div>


    <div class="periodo">

        📅 <strong>Período atual:</strong>

        <span id="periodoAtual">
            Carregando...
        </span>

        <br>

        Este gasto será salvo somente neste período.
        Os gastos de períodos anteriores continuam
        salvos no histórico.

    </div>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <div class="card">


        <div class="campo">

            <label for="valor">

                💰 Valor do gasto

            </label>

            <input
                id="valor"
                class="valor-input"
                type="number"
                min="0"
                step="0.01"
                placeholder="Ex: 50,00"
            >

        </div>


        <div class="campo">

            <label for="categoria">

                📂 Categoria

            </label>

            <select id="categoria">

                <option value="">

                    Selecione uma categoria

                </option>

                <option value="fixos">

                    🏠 Gastos fixos

                </option>

                <option value="alimentacao">

                    🍎 Alimentação

                </option>

                <option value="saude">

                    🏥 Saúde

                </option>

                <option value="higiene">

                    🧼 Higiene

                </option>

                <option value="lazer">

                    🎮 Lazer

                </option>

                <option value="transporte">

                    🚗 Transporte

                </option>

                <option value="educacao">

                    📚 Educação

                </option>

                <option value="investimentos">

                    💰 Investimentos

                </option>

            </select>

            <div class="categoria-info">

                Escolha onde este gasto se encaixa.

            </div>

        </div>


        <div class="campo">

            <label for="descricao">

                📝 Descrição

            </label>

            <textarea
                id="descricao"
                placeholder="Ex: Mercado, gasolina, farmácia..."
            ></textarea>

        </div>


        <div class="campo">

            <label for="data">

                📅 Data do gasto

            </label>

            <input
                id="data"
                type="date"
            >

        </div>


        <div class="botoes">

            <button
                class="botao-salvar"
                onclick="salvarGasto()"
            >

                💾 Salvar gasto

            </button>


            <button
                class="botao-voltar"
                onclick="voltarDashboard()"
            >

                ← Voltar para o Dashboard

            </button>

        </div>


    </div>

</div>


<script>

/* ==================================================
   CATEGORIAS
================================================== */

const categorias = {

    fixos: {
        nome: "Gastos fixos",
        icone: "🏠"
    },

    alimentacao: {
        nome: "Alimentação",
        icone: "🍎"
    },

    saude: {
        nome: "Saúde",
        icone: "🏥"
    },

    higiene: {
        nome: "Higiene",
        icone: "🧼"
    },

    lazer: {
        nome: "Lazer",
        icone: "🎮"
    },

    transporte: {
        nome: "Transporte",
        icone: "🚗"
    },

    educacao: {
        nome: "Educação",
        icone: "📚"
    },

    investimentos: {
        nome: "Investimentos",
        icone: "💰"
    }

};


/* ==================================================
   OBTER MÊS REAL
================================================== */

function obterMesReal() {

    const agora =
        new Date();


    return (
        agora.getFullYear() +
        "-" +
        String(
            agora.getMonth() + 1
        ).padStart(2, "0")
    );

}


/* ==================================================
   OBTER PERÍODO FINANCEIRO ATUAL
==================================================

   IMPORTANTE:

   O registrar.html NÃO cria um período novo.

   Ele sempre pega o período que foi definido
   pelo Dashboard.

   Exemplo:

   2026-09

   depois do pagamento:

   2026-09-periodo-1

   depois:

   2026-09-periodo-2

   Assim cada gasto fica vinculado ao período
   correto.
================================================== */

function obterPeriodo() {

    let periodo =
        localStorage.getItem(
            "periodoFinanceiro"
        );


    /*
        Se ainda não existir um período,
        cria o primeiro período baseado
        no mês atual.
    */

    if (!periodo) {

        periodo =
            obterMesReal();


        localStorage.setItem(
            "periodoFinanceiro",
            periodo
        );

    }


    return periodo;

}


/* ==================================================
   NOME DO PERÍODO
================================================== */

function nomeDoPeriodo(periodo) {

    if (
        !periodo ||
        typeof periodo !== "string"
    ) {

        return "-";

    }


    const partes =
        periodo.split("-");


    if (
        partes.length < 2
    ) {

        return periodo;

    }


    const ano =
        partes[0];


    const numeroMes =
        Number(
            partes[1]
        );


    const meses = [

        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro"

    ];


    if (
        !numeroMes ||
        numeroMes < 1 ||
        numeroMes > 12
    ) {

        return periodo;

    }


    let nome =
        meses[numeroMes - 1] +
        " " +
        ano;


    /*
        Mostra também o número do período.

        Exemplo:

        Setembro 2026 • Período 1
    */

    if (
        partes.length >= 4 &&
        partes[2] === "periodo"
    ) {

        nome +=
            " • Período " +
            partes[3];

    }


    return nome;

}


/* ==================================================
   PEGAR GASTOS
================================================== */

function pegarGastos() {

    const salvo =
        localStorage.getItem(
            "gastos"
        );


    if (!salvo) {

        return [];

    }


    try {

        const gastos =
            JSON.parse(
                salvo
            );


        if (
            Array.isArray(gastos)
        ) {

            return gastos;

        }


        return [];

    } catch {

        return [];

    }

}


/* ==================================================
   SALVAR GASTOS
================================================== */

function salvarGastos(gastos) {

    localStorage.setItem(
        "gastos",
        JSON.stringify(
            gastos
        )
    );

}


/* ==================================================
   DATA DE HOJE
================================================== */

function obterDataHoje() {

    const agora =
        new Date();


    const ano =
        agora.getFullYear();


    const mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        ano +
        "-" +
        mes +
        "-" +
        dia
    );

}


/* ==================================================
   MOSTRAR PERÍODO ATUAL
================================================== */

function mostrarPeriodoAtual() {

    const periodo =
        obterPeriodo();


    document
        .getElementById(
            "periodoAtual"
        )
        .textContent =
            nomeDoPeriodo(
                periodo
            );

}


/* ==================================================
   MOSTRAR MENSAGEM
================================================== */

function mostrarMensagem(
    texto,
    tipo
) {

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        tipo;


}


/* ==================================================
   LIMPAR MENSAGEM
================================================== */

function limparMensagem() {

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        "";


    elemento.className =
        "mensagem";

}


/* ==================================================
   SALVAR GASTO
================================================== */

function salvarGasto() {

    limparMensagem();


    /*
        Pega os campos.
    */

    const campoValor =
        document.getElementById(
            "valor"
        );


    const campoCategoria =
        document.getElementById(
            "categoria"
        );


    const campoDescricao =
        document.getElementById(
            "descricao"
        );


    const campoData =
        document.getElementById(
            "data"
        );


    /*
        Converte o valor.

        Number("50.50") = 50.50
    */

    const valor =
        Number(
            campoValor.value
        );


    const categoria =
        campoCategoria.value;


    const descricao =
        campoDescricao.value.trim();


    const data =
        campoData.value;


    /*
        Validação do valor.
    */

    if (
        !Number.isFinite(valor) ||
        valor <= 0
    ) {

        mostrarMensagem(
            "Digite um valor válido para o gasto.",
            "erro"
        );

        campoValor.focus();

        return;

    }


    /*
        Validação da categoria.
    */

    if (
        !categoria ||
        !categorias[categoria]
    ) {

        mostrarMensagem(
            "Selecione uma categoria.",
            "erro"
        );

        campoCategoria.focus();

        return;

    }


    /*
        Validação da data.
    */

    if (!data) {

        mostrarMensagem(
            "Informe a data do gasto.",
            "erro"
        );

        campoData.focus();

        return;

    }


    /*
        PEGA O PERÍODO ATUAL.

        Esta é a parte mais importante.

        O gasto será salvo com:

        mes: periodoAtual

        Portanto:

        Se o Dashboard está em:

        2026-09

        o gasto será salvo em:

        mes: "2026-09"

        Se o usuário recebeu pagamento
        e o Dashboard está em:

        2026-09-periodo-1

        o novo gasto será salvo em:

        mes: "2026-09-periodo-1"
    */

    const periodoAtual =
        obterPeriodo();


    /*
        Pega todos os gastos antigos.

        NÃO apagamos nenhum deles.
    */

    const gastos =
        pegarGastos();


    /*
        Cria o novo gasto.
    */

    const novoGasto = {

        id:
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 9),

        valor:
            valor,

        categoria:
            categoria,

        descricao:
            descricao ||
            "Gasto registrado",

        data:
            data,

        mes:
            periodoAtual,

        criadoEm:
            new Date().toISOString()

    };


    /*
        Adiciona o novo gasto
        ao final da lista.

        Os gastos antigos continuam
        exatamente onde estavam.
    */

    gastos.push(
        novoGasto
    );


    /*
        Salva TODOS os gastos novamente.
    */

    salvarGastos(
        gastos
    );


    /*
        Limpa os campos.
    */

    campoValor.value =
        "";

    campoCategoria.value =
        "";

    campoDescricao.value =
        "";

    campoData.value =
        obterDataHoje();


    /*
        Mostra confirmação.
    */

    mostrarMensagem(

        "Gasto registrado com sucesso! 💚",

        "sucesso"

    );


    /*
        Atualiza o período mostrado.
    */

    mostrarPeriodoAtual();


    /*
        Depois de um pequeno intervalo,
        volta para o Dashboard.
    */

    setTimeout(
        function() {

            window.location.href =
                "dashboard.html";

        },
        700
    );

}


/* ==================================================
   VOLTAR PARA O DASHBOARD
================================================== */

function voltarDashboard() {

    window.location.href =
        "dashboard.html";

}


/* ==================================================
   TECLA ENTER
==================================================

   Permite salvar pressionando Enter
   quando estiver no campo de descrição.
================================================== */

document
    .getElementById(
        "descricao"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                salvarGasto();

            }

        }
    );


/* ==================================================
   INICIAR
================================================== */

function iniciar() {

    mostrarPeriodoAtual();


    /*
        Coloca a data de hoje automaticamente.
    */

    document
        .getElementById(
            "data"
        )
        .value =
            obterDataHoje();


    /*
        Coloca o cursor no valor.
    */

    document
        .getElementById(
            "valor"
        )
        .focus();

}


iniciar();

</script>

</body>

</html>
