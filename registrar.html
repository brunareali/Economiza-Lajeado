<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registrar gasto - Meu Dinheiro</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7f5;
    color: #26352b;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: 30px auto;
}

.voltar {
    display: inline-block;
    color: #287a4b;
    text-decoration: none;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.07);
}

h1 {
    color: #287a4b;
    margin-bottom: 8px;
}

.subtitulo {
    color: #718078;
    line-height: 1.5;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #d8ded9;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 18px;
    background: white;
}

input:focus,
select:focus {
    outline: none;
    border-color: #287a4b;
    box-shadow: 0 0 0 3px rgba(40,122,75,0.1);
}

.periodo-atual {
    background: #e8f5eb;
    color: #287a4b;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.5;
    font-size: 14px;
}

.orcamento {
    background: #f0f5f1;
    color: #287a4b;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.6;
    display: none;
}

.orcamento.excedido {
    background: #fff0ee;
    color: #c0392b;
}

.orcamento.atencao {
    background: #fff8df;
    color: #856404;
}

.orcamento strong {
    font-weight: bold;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #287a4b;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1f633c;
}

.cancelar {
    margin-top: 10px;
    background: white;
    color: #287a4b;
    border: 1px solid #287a4b;
}

.cancelar:hover {
    background: #eef5f0;
}

@media (max-width: 500px) {

    .card {
        padding: 22px;
    }

}

</style>

</head>

<body>

<div class="container">

<a href="dashboard.html" class="voltar">
← Voltar para o resumo
</a>

<div class="card">

<h1>
Registrar gasto 💸
</h1>

<p class="subtitulo">
Registre seu gasto para acompanhar
quanto você já utilizou em cada categoria.
</p>


<div
    id="periodoAtual"
    class="periodo-atual"
>
</div>


<form onsubmit="registrarGasto(event)">

<label for="descricao">
O que você comprou?
</label>

<input
id="descricao"
type="text"
placeholder="Ex: Mercado"
required
>


<label for="valor">
Quanto você gastou?
</label>

<input
id="valor"
type="number"
min="0.01"
step="0.01"
placeholder="Ex: 50,00"
required
oninput="mostrarOrcamento()"
>


<label for="categoria">
Categoria
</label>

<select
id="categoria"
required
onchange="mostrarOrcamento()"
>

<option value="">
Escolha uma categoria
</option>

<option value="fixos">
🏠 Gastos fixos
</option>

<option value="alimentacao">
🍎 Alimentação
</option>

<option value="saude">
🏥 Saúde
</option>

<option value="higiene">
🧼 Higiene
</option>

<option value="lazer">
🎮 Lazer
</option>

<option value="transporte">
🚗 Transporte
</option>

<option value="educacao">
📚 Educação
</option>

<option value="investimentos">
💰 Investimentos
</option>

</select>


<div
id="informacaoOrcamento"
class="orcamento"
></div>


<label for="data">
Data do gasto
</label>

<input
id="data"
type="date"
required
>


<button type="submit">
💾 Salvar gasto
</button>

</form>


<button
class="cancelar"
onclick="window.location.href='dashboard.html'"
>
Cancelar
</button>

</div>

</div>


<script>

/* =========================
CATEGORIAS
========================= */

const nomesCategorias = {

    fixos: "🏠 Gastos fixos",

    alimentacao: "🍎 Alimentação",

    saude: "🏥 Saúde",

    higiene: "🧼 Higiene",

    lazer: "🎮 Lazer",

    transporte: "🚗 Transporte",

    educacao: "📚 Educação",

    investimentos: "💰 Investimentos"

};


/* =========================
DATA ATUAL
========================= */

function colocarDataAtual() {

    const hoje =
        new Date();


    const ano =
        hoje.getFullYear();


    const mes =
        String(
            hoje.getMonth() + 1
        ).padStart(2, "0");


    const dia =
        String(
            hoje.getDate()
        ).padStart(2, "0");


    document
        .getElementById("data")
        .value =
            ano +
            "-" +
            mes +
            "-" +
            dia;

}


/* =========================
MOEDA
========================= */

function moeda(valor) {

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


/* =========================
MÊS REAL
========================= */

function obterMesReal() {

    const hoje =
        new Date();


    return (
        hoje.getFullYear() +
        "-" +
        String(
            hoje.getMonth() + 1
        ).padStart(2, "0")
    );

}


/* =========================
PERÍODO FINANCEIRO
========================= */

function obterPeriodo() {

    const salvo =
        localStorage.getItem(
            "periodoFinanceiro"
        );


    /*
        Se já existe um período,
        usamos exatamente ele.

        Isso é importante porque
        depois de clicar em
        "Recebi meu pagamento",
        o período pode ser:

        2026-09-periodo-1

        e não apenas:

        2026-09
    */

    if (salvo) {

        return salvo;

    }


    const periodo =
        obterMesReal();


    localStorage.setItem(
        "periodoFinanceiro",
        periodo
    );


    return periodo;

}


/* =========================
NOME DO PERÍODO
========================= */

function nomeDoPeriodo(periodo) {

    if (!periodo) {

        return "Período atual";

    }


    const partes =
        periodo.split("-");


    if (
        partes.length < 2
    ) {

        return "Período atual";

    }


    const ano =
        partes[0];


    const numeroMes =
        Number(partes[1]);


    const meses = [

        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro"

    ];


    if (
        numeroMes < 1 ||
        numeroMes > 12
    ) {

        return "Período atual";

    }


    let nome =
        meses[numeroMes - 1] +
        " " +
        ano;


    /*
        Mostra o número do período
        quando existir.

        Exemplo:

        Setembro 2026 • Período 1
    */

    if (
        partes.length >= 4 &&
        partes[2] === "periodo"
    ) {

        nome +=
            " • Período " +
            partes[3];

    }


    return nome;

}


/* =========================
MOSTRAR PERÍODO NA TELA
========================= */

function mostrarPeriodoAtual() {

    const periodo =
        obterPeriodo();


    const elemento =
        document.getElementById(
            "periodoAtual"
        );


    elemento.innerHTML =

        "📅 <strong>Período atual:</strong> " +

        nomeDoPeriodo(periodo) +

        "<br><br>" +

        "Este gasto será registrado " +
        "somente no período atual.";

}


/* =========================
PEGAR GASTOS
========================= */

function pegarGastos() {

    const salvo =
        localStorage.getItem(
            "gastos"
        );


    if (!salvo) {

        return [];

    }


    try {

        const gastos =
            JSON.parse(salvo);


        return Array.isArray(gastos)
            ? gastos
            : [];


    } catch {

        return [];

    }

}


/* =========================
PEGAR ORÇAMENTO
========================= */

function pegarOrcamento() {

    /*
        Primeiro tentamos usar
        o planejamento novo.
    */

    const planejamentoSalvo =
        localStorage.getItem(
            "planejamentoFinanceiro"
        );


    if (planejamentoSalvo) {

        try {

            const planejamento =
                JSON.parse(
                    planejamentoSalvo
                );


            if (
                planejamento &&
                planejamento.categorias &&
                typeof planejamento.categorias === "object"
            ) {

                return planejamento.categorias;

            }

        } catch {

            console.log(
                "Planejamento inválido."
            );

        }

    }


    /*
        Compatibilidade com
        o orçamento antigo.
    */

    const salvo =
        localStorage.getItem(
            "orcamento"
        );


    if (salvo) {

        try {

            const orcamento =
                JSON.parse(
                    salvo
                );


            if (
                orcamento &&
                typeof orcamento === "object"
            ) {

                return orcamento;

            }

        } catch {

            console.log(
                "Orçamento inválido."
            );

        }

    }


    return {};

}


/* =========================
CALCULAR UTILIZADO
========================= */

function calcularUtilizado(
    categoria
) {

    const gastos =
        pegarGastos();


    const periodo =
        obterPeriodo();


    let utilizado =
        0;


    gastos.forEach(function(gasto) {

        /*
            A comparação usa o período
            financeiro completo.

            Portanto:

            2026-09

            é diferente de:

            2026-09-periodo-1
        */

        if (
            gasto.categoria === categoria &&
            gasto.mes === periodo
        ) {

            utilizado +=
                Number(
                    gasto.valor
                ) || 0;

        }

    });


    return utilizado;

}


/* =========================
MOSTRAR ORÇAMENTO
========================= */

function mostrarOrcamento() {

    const categoria =
        document.getElementById(
            "categoria"
        ).value;


    const valor =
        Number(
            document.getElementById(
                "valor"
            ).value
        ) || 0;


    const caixa =
        document.getElementById(
            "informacaoOrcamento"
        );


    if (!categoria) {

        caixa.style.display =
            "none";

        return;

    }


    const orcamento =
        pegarOrcamento();


    const limite =
        Number(
            orcamento[categoria]
        ) || 0;


    const utilizado =
        calcularUtilizado(
            categoria
        );


    const disponivel =
        limite -
        utilizado;


    const restanteDepois =
        limite -
        (
            utilizado +
            valor
        );


    caixa.style.display =
        "block";


    caixa.className =
        "orcamento";


    /*
        Não existe orçamento.
    */

    if (limite <= 0) {

        caixa.innerHTML =

            "⚠️ Você ainda não definiu um orçamento " +
            "para esta categoria.<br><br>" +

            "Você pode definir um valor em " +
            "<strong>Editar orçamento</strong>.";

        return;

    }


    /*
        Ainda não digitou o valor.
    */

    if (valor <= 0) {

        caixa.innerHTML =

            "💰 <strong>Orçamento:</strong> " +
            moeda(limite) +

            "<br>" +

            "📊 <strong>Já utilizado:</strong> " +
            moeda(utilizado) +

            "<br>" +

            "💚 <strong>Disponível:</strong> " +
            moeda(disponivel);

        return;

    }


    /*
        Vai ultrapassar.
    */

    if (
        restanteDepois < 0
    ) {

        caixa.classList.add(
            "excedido"
        );


        caixa.innerHTML =

            "⚠️ <strong>Atenção!</strong> " +

            "Este gasto ultrapassará " +
            "seu orçamento." +

            "<br><br>" +

            "💰 Orçamento: " +
            moeda(limite) +

            "<br>" +

            "📊 Já utilizado: " +
            moeda(utilizado) +

            "<br>" +

            "🛒 Novo gasto: " +
            moeda(valor) +

            "<br>" +

            "🔴 Ultrapassará em: " +
            moeda(
                Math.abs(
                    restanteDepois
                )
            );

        return;

    }


    /*
        Restará 20% ou menos.
    */

    if (
        restanteDepois <=
        limite * 0.2
    ) {

        caixa.classList.add(
            "atencao"
        );


        caixa.innerHTML =

            "⚠️ <strong>Quase no limite!</strong>" +

            "<br><br>" +

            "💰 Orçamento: " +
            moeda(limite) +

            "<br>" +

            "📊 Já utilizado: " +
            moeda(utilizado) +

            "<br>" +

            "🛒 Novo gasto: " +
            moeda(valor) +

            "<br>" +

            "🟡 Restará: " +
            moeda(restanteDepois);

        return;

    }


    /*
        Tudo normal.
    */

    caixa.innerHTML =

        "✅ <strong>Tudo certo!</strong>" +

        "<br><br>" +

        "💰 Orçamento: " +
        moeda(limite) +

        "<br>" +

        "📊 Já utilizado: " +
        moeda(utilizado) +

        "<br>" +

        "🛒 Novo gasto: " +
        moeda(valor) +

        "<br>" +

        "💚 Restará: " +
        moeda(restanteDepois);

}


/* =========================
REGISTRAR GASTO
========================= */

function registrarGasto(event) {

    event.preventDefault();


    const descricao =
        document
            .getElementById(
                "descricao"
            )
            .value
            .trim();


    const valor =
        Number(
            document
                .getElementById(
                    "valor"
                )
                .value
        );


    const categoria =
        document
            .getElementById(
                "categoria"
            )
            .value;


    const data =
        document
            .getElementById(
                "data"
            )
            .value;


    /*
        VALIDAÇÕES
    */

    if (!descricao) {

        alert(
            "Digite a descrição do gasto."
        );

        return;

    }


    if (
        !Number.isFinite(valor) ||
        valor <= 0
    ) {

        alert(
            "Digite um valor válido."
        );

        return;

    }


    if (!categoria) {

        alert(
            "Escolha uma categoria."
        );

        return;

    }


    if (!data) {

        alert(
            "Escolha a data do gasto."
        );

        return;

    }


    /*
        PEGA O PERÍODO ATUAL.

        É MUITO IMPORTANTE que o gasto
        receba o período financeiro atual,
        e não simplesmente o mês da data.
    */

    const periodo =
        obterPeriodo();


    const orcamento =
        pegarOrcamento();


    const limite =
        Number(
            orcamento[categoria]
        ) || 0;


    const gastos =
        pegarGastos();


    /*
        Calcula somente o que foi gasto
        dentro do período atual.
    */

    let utilizado =
        0;


    gastos.forEach(function(gasto) {

        if (
            gasto.categoria === categoria &&
            gasto.mes === periodo
        ) {

            utilizado +=
                Number(
                    gasto.valor
                ) || 0;

        }

    });


    /*
        AVISO DE ORÇAMENTO
    */

    if (
        limite > 0 &&
        utilizado + valor > limite
    ) {

        const excesso =
            utilizado +
            valor -
            limite;


        const continuar =
            confirm(

                "⚠️ ATENÇÃO!\n\n" +

                "Este gasto vai ultrapassar " +
                "o orçamento desta categoria.\n\n" +

                "Orçamento: " +
                moeda(limite) +

                "\nJá utilizado: " +
                moeda(utilizado) +

                "\nNovo gasto: " +
                moeda(valor) +

                "\n\nUltrapassará em: " +
                moeda(excesso) +

                "\n\nDeseja registrar mesmo assim?"

            );


        if (!continuar) {

            return;

        }

    }


    /*
        CRIA O GASTO
    */

    const gasto = {

        id:
            Date.now().toString() +
            Math.random()
                .toString(16)
                .slice(2),


        descricao:
            descricao,


        valor:
            valor,


        categoria:
            categoria,


        data:
            data,


        /*
            Aqui está uma das partes
            mais importantes da correção.

            O gasto recebe o período
            financeiro atual.

            Exemplo:

            2026-09-periodo-1
        */

        mes:
            periodo,


        criadoEm:
            new Date().toISOString()

    };


    /*
        ADICIONA O GASTO
    */

    gastos.push(
        gasto
    );


    /*
        SALVA TODOS OS GASTOS.
    */

    localStorage.setItem(
        "gastos",
        JSON.stringify(
            gastos
        )
    );


    /*
        CONFIRMAÇÃO
    */

    alert(

        "Gasto registrado com sucesso! 💚\n\n" +

        "Período: " +
        nomeDoPeriodo(periodo)

    );


    /*
        VOLTA PARA O DASHBOARD.
    */

    window.location.href =
        "dashboard.html";

}


/* =========================
INICIAR
========================= */

colocarDataAtual();

mostrarPeriodoAtual();

mostrarOrcamento();

</script>

</body>

</html>
