<script>
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Registrar gasto - Meu Dinheiro</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}


body {

    background: #f5f7f5;

    color: #26352b;

    min-height: 100vh;

    padding: 20px;

}


.container {

    max-width: 500px;

    margin: 40px auto;

}


.voltar {

    display: inline-block;

    color: #287a4b;

    text-decoration: none;

    margin-bottom: 20px;

    font-weight: bold;

}


.card {

    background: white;

    padding: 30px;

    border-radius: 22px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.06);

}


h1 {

    color: #287a4b;

    margin-bottom: 8px;

}


.subtitulo {

    color: #718078;

    line-height: 1.5;

    margin-bottom: 25px;

}


label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;

}


input,
select {

    width: 100%;

    padding: 14px;

    border: 1px solid #d8ded9;

    border-radius: 12px;

    font-size: 16px;

    margin-bottom: 20px;

    background: white;

}


input:focus,
select:focus {

    outline: none;

    border-color: #287a4b;

    box-shadow:
        0 0 0 3px
        rgba(40,122,75,0.10);

}


button {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 14px;

    background: #287a4b;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


button:hover {

    background: #1f633c;

}


.disponivel {

    background: #f0f5f1;

    padding: 15px;

    border-radius: 12px;

    margin-top: -5px;

    margin-bottom: 20px;

    color: #287a4b;

    line-height: 1.5;

}


.disponivel.negativo {

    background: #fff0ee;

    color: #c0392b;

}


.erro {

    display: none;

    background: #fff0ee;

    color: #c0392b;

    padding: 14px;

    border-radius: 12px;

    margin-bottom: 20px;

    line-height: 1.5;

}


.info {

    background: #f0f5f1;

    color: #718078;

    padding: 14px;

    border-radius: 12px;

    margin-bottom: 20px;

    font-size: 14px;

    line-height: 1.5;

}


.sem-planejamento {

    background: #fff3cd;

    color: #856404;

    padding: 15px;

    border-radius: 12px;

    margin-bottom: 20px;

    line-height: 1.5;

}

</style>

</head>


<body>


<div class="container">


<a
    href="dashboard.html"
    class="voltar"
>
    ← Voltar para o resumo
</a>


<div class="card">


<h1>
    Registrar gasto 💸
</h1>


<p class="subtitulo">

    Registre seus gastos e acompanhe
    o saldo de cada categoria.

</p>


<div class="info">

    💡 Os valores das categorias são
    carregados automaticamente do seu
    planejamento mensal.

    <br><br>

    ⚠️ Se você gastar mais do que planejou,
    o gasto será registrado normalmente.
    O saldo da categoria ficará negativo.

</div>


<div
    id="semPlanejamento"
    class="sem-planejamento"
    style="display: none;"
>

    ⚠️ Você ainda não criou um planejamento
    mensal.

    <br><br>

    Crie seu planejamento antes de
    registrar seus gastos.

</div>


<div
    id="erro"
    class="erro"
></div>


<label for="descricao">

    O que você comprou?

</label>


<input
    id="descricao"
    type="text"
    placeholder="Ex: Mercado"
    maxlength="100"
>


<label for="valor">

    Quanto custou?

</label>


<input
    id="valor"
    type="number"
    min="0.01"
    step="0.01"
    placeholder="Ex: 50,00"
    oninput="mostrarDisponivel()"
>


<label for="categoria">

    Qual categoria?

</label>


<select
    id="categoria"
    onchange="mostrarDisponivel()"
>

    <option value="">
        Escolha uma categoria
    </option>

</select>


<div
    id="disponivel"
    class="disponivel"
    style="display: none;"
>

</div>


<button
    type="button"
    onclick="registrarGasto()"
>

    Registrar gasto →

</button>


</div>

</div>


<script>


/* =====================================================
   CATEGORIAS
===================================================== */

const nomesCategorias = {

    fixos: "🏠 Gastos fixos",

    alimentacao: "🍎 Alimentação",

    saude: "🏥 Saúde",

    higiene: "🧼 Higiene",

    lazer: "🎮 Lazer",

    transporte: "🚗 Transporte",

    educacao: "📚 Educação",

    investimentos: "💰 Investimentos"

};


/* =====================================================
   MOEDA
===================================================== */

function moeda(valor) {

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


/* =====================================================
   PEGAR PLANEJAMENTO
===================================================== */

function pegarPlanejamento() {

    const salvo =
        localStorage.getItem(
            "planejamentoFinanceiro"
        );


    if (!salvo) {

        return null;

    }


    try {

        return JSON.parse(salvo);

    }

    catch {

        return null;

    }

}


/* =====================================================
   PEGAR GASTOS
===================================================== */

function pegarGastos() {

    const salvo =
        localStorage.getItem(
            "gastos"
        );


    if (!salvo) {

        return [];

    }


    try {

        const gastos =
            JSON.parse(salvo);


        return Array.isArray(gastos)
            ? gastos
            : [];

    }

    catch {

        return [];

    }

}


/* =====================================================
   MÊS ATUAL
===================================================== */

function mesAtual() {

    const agora =
        new Date();


    return (

        agora.getFullYear()

        +

        "-"

        +

        String(
            agora.getMonth() + 1
        ).padStart(2, "0")

    );

}


/* =====================================================
   CARREGAR CATEGORIAS DO PLANEJAMENTO
===================================================== */

function carregarCategorias() {

    const planejamento =
        pegarPlanejamento();


    const select =
        document.getElementById(
            "categoria"
        );


    const aviso =
        document.getElementById(
            "semPlanejamento"
        );


    /*
       Remove as opções antigas,
       mantendo apenas a primeira.
    */

    select.innerHTML = `

        <option value="">
            Escolha uma categoria
        </option>

    `;


    if (
        !planejamento
        ||
        !planejamento.categorias
    ) {

        aviso.style.display =
            "block";

        return;

    }


    aviso.style.display =
        "none";


    /*
       Carrega as categorias
       diretamente do planejamento.
    */

    Object.keys(
        nomesCategorias
    ).forEach(
        function(categoria) {


            /*
               Se a categoria existe no
               planejamento, ela aparece.
            */

            if (
                Object.prototype.hasOwnProperty.call(
                    planejamento.categorias,
                    categoria
                )
            ) {


                const valor =
                    Number(
                        planejamento
                            .categorias[categoria]
                    ) || 0;


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    categoria;


                option.textContent =

                    nomesCategorias[categoria]

                    +

                    " — "

                    +

                    moeda(valor);


                select.appendChild(
                    option
                );

            }

        }
    );

}


/* =====================================================
   TOTAL GASTO DA CATEGORIA
===================================================== */

function totalGastoCategoria(
    categoria
) {

    const gastos =
        pegarGastos();


    let total = 0;


    gastos.forEach(
        function(gasto) {

            if (

                gasto.categoria ===
                    categoria

                &&

                gasto.mes ===
                    mesAtual()

            ) {

                total +=
                    Number(
                        gasto.valor
                    ) || 0;

            }

        }
    );


    return total;

}


/* =====================================================
   VALOR PLANEJADO DA CATEGORIA
===================================================== */

function valorPlanejado(
    categoria
) {

    const planejamento =
        pegarPlanejamento();


    if (
        !planejamento
        ||
        !planejamento.categorias
    ) {

        return 0;

    }


    return Number(
        planejamento
            .categorias[categoria]
    ) || 0;

}


/* =====================================================
   SALDO DA CATEGORIA
===================================================== */

function saldoCategoria(
    categoria
) {

    const planejado =
        valorPlanejado(
            categoria
        );


    const gasto =
        totalGastoCategoria(
            categoria
        );


    return planejado - gasto;

}


/* =====================================================
   RENDA
===================================================== */

function pegarRenda() {

    const planejamento =
        pegarPlanejamento();


    if (
        planejamento
        &&
        Number.isFinite(
            Number(
                planejamento.renda
            )
        )
    ) {

        return Number(
            planejamento.renda
        );

    }


    return 0;

}


/* =====================================================
   TOTAL PLANEJADO
===================================================== */

function totalPlanejado() {

    const planejamento =
        pegarPlanejamento();


    if (
        !planejamento
        ||
        !planejamento.categorias
    ) {

        return 0;

    }


    let total = 0;


    Object.keys(
        planejamento.categorias
    ).forEach(
        function(categoria) {

            total +=
                Number(
                    planejamento
                        .categorias[categoria]
                ) || 0;

        }
    );


    return total;

}


/* =====================================================
   DINHEIRO NÃO PLANEJADO INICIAL
===================================================== */

function dinheiroNaoPlanejadoInicial() {

    const renda =
        pegarRenda();


    const planejado =
        totalPlanejado();


    return renda - planejado;

}


/* =====================================================
   EXCESSO DA CATEGORIA
===================================================== */

function excessoCategoria(
    categoria
) {

    const saldo =
        saldoCategoria(
            categoria
        );


    if (saldo < 0) {

        return Math.abs(
            saldo
        );

    }


    return 0;

}


/* =====================================================
   TOTAL DOS EXCESSOS
===================================================== */

function totalExcessos() {

    let total = 0;


    Object.keys(
        nomesCategorias
    ).forEach(
        function(categoria) {

            total +=
                excessoCategoria(
                    categoria
                );

        }
    );


    return total;

}


/* =====================================================
   DINHEIRO NÃO PLANEJADO ATUAL
===================================================== */

function dinheiroNaoPlanejadoAtual() {

    const inicial =
        dinheiroNaoPlanejadoInicial();


    const excessos =
        totalExcessos();


    return inicial - excessos;

}


/* =====================================================
   MOSTRAR DISPONÍVEL
===================================================== */

function mostrarDisponivel() {

    const categoria =
        document
            .getElementById(
                "categoria"
            )
            .value;


    const elemento =
        document
            .getElementById(
                "disponivel"
            );


    const valorDigitado =
        Number(
            document
                .getElementById(
                    "valor"
                )
                .value
        ) || 0;


    if (!categoria) {

        elemento.style.display =
            "none";

        return;

    }


    const saldoAtual =
        saldoCategoria(
            categoria
        );


    const saldoDepois =
        saldoAtual -
        valorDigitado;


    elemento.style.display =
        "block";


    if (saldoDepois < 0) {


        elemento.classList.add(
            "negativo"
        );


        elemento.innerHTML =

            "⚠️ <strong>" +

            nomesCategorias[categoria] +

            "</strong> ficará negativa."

            +

            "<br><br>"

            +

            "Saldo depois deste gasto: "

            +

            "<strong>" +

            moeda(
                saldoDepois
            )

            +

            "</strong>"

            +

            "<br><br>"

            +

            "O gasto será registrado normalmente "

            +

            "e o excesso será descontado "

            +

            "do dinheiro não planejado.";

    }

    else {


        elemento.classList.remove(
            "negativo"
        );


        elemento.innerHTML =

            "Disponível nesta categoria: "

            +

            "<strong>"

            +

            moeda(
                saldoDepois
            )

            +

            "</strong>";

    }

}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro(
    mensagem
) {

    const elemento =
        document.getElementById(
            "erro"
        );


    elemento.textContent =
        mensagem;


    elemento.style.display =
        "block";

}


/* =====================================================
   ESCONDER ERRO
===================================================== */

function esconderErro() {

    document
        .getElementById(
            "erro"
        )
        .style.display =
        "none";

}


/* =====================================================
   REGISTRAR GASTO
===================================================== */

function registrarGasto() {

    esconderErro();


    const descricao =
        document
            .getElementById(
                "descricao"
            )
            .value
            .trim();


    const valor =
        Number(
            document
                .getElementById(
                    "valor"
                )
                .value
        );


    const categoria =
        document
            .getElementById(
                "categoria"
            )
            .value;


    /* ================================================
       VALIDAÇÃO
    ================================================ */

    if (!descricao) {

        mostrarErro(
            "Digite o que você comprou."
        );

        return;

    }


    if (
        !Number.isFinite(valor)
        ||
        valor <= 0
    ) {

        mostrarErro(
            "Digite um valor válido."
        );

        return;

    }


    if (!categoria) {

        mostrarErro(
            "Escolha uma categoria."
        );

        return;

    }


    /* ================================================
       PEGAR GASTOS
    ================================================ */

    const gastos =
        pegarGastos();


    /* ================================================
       CRIAR ID
    ================================================ */

    const id =

        Date.now().toString()

        +

        "-"

        +

        Math.random()
            .toString(36)
            .substring(2, 9);


    const agora =
        new Date();


    /* ================================================
       CRIAR GASTO
    ================================================ */

    const novoGasto = {

        id: id,

        descricao: descricao,

        valor: valor,

        categoria: categoria,

        data:
            agora.toLocaleDateString(
                "pt-BR"
            ),

        mes:
            mesAtual(),

        criadoEm:
            agora.toISOString()

    };


    /* ================================================
       SALVAR
    ================================================ */

    gastos.push(
        novoGasto
    );


    localStorage.setItem(

        "gastos",

        JSON.stringify(
            gastos
        )

    );


    /* ================================================
       CALCULAR RESULTADO
    ================================================ */

    const planejado =
        valorPlanejado(
            categoria
        );


    const totalGasto =
        totalGastoCategoria(
            categoria
        );


    const saldo =
        planejado -
        totalGasto;


    const naoPlanejado =
        dinheiroNaoPlanejadoAtual();


    /* ================================================
       AVISO
    ================================================ */

    if (saldo < 0) {


        alert(

            "Gasto registrado! 💚"

            +

            "\n\n"

            +

            "⚠️ Você ultrapassou o planejamento."

            +

            "\n\n"

            +

            "Categoria: "

            +

            nomesCategorias[
                categoria
            ]

            +

            "\n"

            +

            "Planejado: "

            +

            moeda(
                planejado
            )

            +

            "\n"

            +

            "Gasto total: "

            +

            moeda(
                totalGasto
            )

            +

            "\n"

            +

            "Saldo da categoria: "

            +

            moeda(
                saldo
            )

            +

            "\n\n"

            +

            "💰 Dinheiro não planejado restante: "

            +

            moeda(
                naoPlanejado
            )

        );

    }

    else {


        alert(

            "Gasto registrado com sucesso! 💚"

            +

            "\n\n"

            +

            "Categoria: "

            +

            nomesCategorias[
                categoria
            ]

            +

            "\n"

            +

            "Saldo restante: "

            +

            moeda(
                saldo
            )

        );

    }


    /* ================================================
       VOLTAR PARA DASHBOARD
    ================================================ */

    window.location.href =
        "dashboard.html";

}


/* =====================================================
   INICIAR
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        carregarCategorias();

        mostrarDisponivel();

    }

);

</script>


</body>

</html>
