<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registrar gasto - Economiza.com</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7f5;
    color: #26352b;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: 30px auto;
}

.voltar {
    display: inline-block;
    color: #287a4b;
    text-decoration: none;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.07);
}

.logo {
    color: #287a4b;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 18px;
}

h1 {
    color: #287a4b;
    margin-bottom: 8px;
}

.subtitulo {
    color: #718078;
    line-height: 1.5;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #d8ded9;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 18px;
    background: white;
}

input:focus,
select:focus {
    outline: none;
    border-color: #287a4b;
    box-shadow: 0 0 0 3px rgba(40,122,75,0.1);
}

.orcamento {
    background: #f0f5f1;
    color: #287a4b;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.6;
    display: none;
}

.orcamento.excedido {
    background: #fff0ee;
    color: #c0392b;
}

.orcamento.atencao {
    background: #fff8df;
    color: #856404;
}

.orcamento strong {
    font-weight: bold;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #287a4b;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1f633c;
}

.cancelar {
    margin-top: 10px;
    background: white;
    color: #287a4b;
    border: 1px solid #287a4b;
}

.cancelar:hover {
    background: #eef5f0;
}

@media (max-width: 550px) {

    .card {
        padding: 25px 20px;
    }

}

</style>

</head>

<body>

<div class="container">

<a href="dashboard.html" class="voltar">
← Voltar para o resumo
</a>

<div class="card">

<div class="logo">
ECONOMIZA.COM
</div>

<h1>
Registrar gasto 💸
</h1>

<p class="subtitulo">
Registre seu gasto para acompanhar
quanto você já utilizou em cada categoria.
</p>

<form onsubmit="registrarGasto(event)">

<label for="descricao">
O que você comprou?
</label>

<input
id="descricao"
type="text"
placeholder="Ex: Mercado"
required
>

<label for="valor">
Quanto você gastou?
</label>

<input
id="valor"
type="number"
min="0.01"
step="0.01"
placeholder="Ex: 50,00"
required
oninput="mostrarOrcamento()"
>

<label for="categoria">
Categoria
</label>

<select
id="categoria"
required
onchange="mostrarOrcamento()"
>

<option value="">
Escolha uma categoria
</option>

<option value="fixos">
🏠 Gastos fixos
</option>

<option value="alimentacao">
🍎 Alimentação
</option>

<option value="saude">
🏥 Saúde
</option>

<option value="higiene">
🧼 Higiene
</option>

<option value="lazer">
🎮 Lazer
</option>

<option value="transporte">
🚗 Transporte
</option>

<option value="educacao">
📚 Educação
</option>

<option value="investimentos">
💰 Investimentos
</option>

</select>

<div
id="informacaoOrcamento"
class="orcamento"
></div>

<label for="data">
Data do gasto
</label>

<input
id="data"
type="date"
required
>

<button type="submit">
💾 Salvar gasto
</button>

</form>

<button
class="cancelar"
onclick="window.location.href='dashboard.html'"
>
Cancelar
</button>

</div>

</div>

<script>

function colocarDataAtual() {

    const hoje = new Date();

    const ano = hoje.getFullYear();

    const mes = String(
        hoje.getMonth() + 1
    ).padStart(2, "0");

    const dia = String(
        hoje.getDate()
    ).padStart(2, "0");

    document.getElementById("data").value =
        ano + "-" + mes + "-" + dia;

}


function moeda(valor) {

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


function obterMesAtual() {

    const hoje = new Date();

    return (
        hoje.getFullYear() +
        "-" +
        String(
            hoje.getMonth() + 1
        ).padStart(2, "0")
    );

}


function obterPeriodo() {

    const salvo =
        localStorage.getItem(
            "periodoFinanceiro"
        );

    if (salvo) {
        return salvo;
    }

    const periodo =
        obterMesAtual();

    localStorage.setItem(
        "periodoFinanceiro",
        periodo
    );

    return periodo;

}


function pegarGastos() {

    const salvo =
        localStorage.getItem("gastos");

    if (!salvo) {
        return [];
    }

    try {

        const gastos =
            JSON.parse(salvo);

        return Array.isArray(gastos)
            ? gastos
            : [];

    } catch {

        return [];

    }

}


function pegarOrcamento() {

    const planejamentoSalvo =
        localStorage.getItem(
            "planejamentoFinanceiro"
        );

    if (planejamentoSalvo) {

        try {

            const planejamento =
                JSON.parse(
                    planejamentoSalvo
                );

            if (
                planejamento &&
                planejamento.categorias
            ) {

                return planejamento.categorias;

            }

        } catch {

            console.log(
                "Planejamento inválido."
            );

        }

    }

    const salvo =
        localStorage.getItem(
            "orcamento"
        );

    if (salvo) {

        try {

            const orcamento =
                JSON.parse(salvo);

            if (
                orcamento &&
                typeof orcamento === "object"
            ) {

                return orcamento;

            }

        } catch {

            console.log(
                "Orçamento inválido."
            );

        }

    }

    return {};

}


function calcularUtilizado(categoria) {

    const gastos =
        pegarGastos();

    const periodo =
        obterPeriodo();

    let utilizado = 0;

    gastos.forEach(function(gasto) {

        if (
            gasto.categoria === categoria &&
            gasto.mes === periodo
        ) {

            utilizado +=
                Number(gasto.valor) || 0;

        }

    });

    return utilizado;

}


function mostrarOrcamento() {

    const categoria =
        document.getElementById(
            "categoria"
        ).value;

    const valor =
        Number(
            document.getElementById(
                "valor"
            ).value
        ) || 0;

    const caixa =
        document.getElementById(
            "informacaoOrcamento"
        );

    if (!categoria) {

        caixa.style.display = "none";

        return;

    }

    const orcamento =
        pegarOrcamento();

    const limite =
        Number(
            orcamento[categoria]
        ) || 0;

    const utilizado =
        calcularUtilizado(
            categoria
        );

    const disponivel =
        limite - utilizado;

    const restanteDepois =
        limite -
        (utilizado + valor);

    caixa.style.display = "block";

    caixa.className = "orcamento";


    if (limite <= 0) {

        caixa.innerHTML =
            "⚠️ Você ainda não definiu um orçamento " +
            "para esta categoria.<br><br>" +

            "Você pode definir um valor em " +
            "<strong>Editar orçamento</strong>.";

        return;

    }


    if (valor <= 0) {

        caixa.innerHTML =
            "💰 <strong>Orçamento:</strong> " +
            moeda(limite) +

            "<br>" +

            "📊 <strong>Já utilizado:</strong> " +
            moeda(utilizado) +

            "<br>" +

            "💚 <strong>Disponível:</strong> " +
            moeda(disponivel);

        return;

    }


    if (restanteDepois < 0) {

        caixa.classList.add(
            "excedido"
        );

        caixa.innerHTML =
            "⚠️ <strong>Atenção!</strong> " +
            "Este gasto ultrapassará seu orçamento." +

            "<br><br>" +

            "💰 Orçamento: " +
            moeda(limite) +

            "<br>" +

            "📊 Já utilizado: " +
            moeda(utilizado) +

            "<br>" +

            "🛒 Novo gasto: " +
            moeda(valor) +

            "<br>" +

            "🔴 Ultrapassará em: " +
            moeda(
                Math.abs(restanteDepois)
            );

        return;

    }


    if (
        restanteDepois <=
        limite * 0.2
    ) {

        caixa.classList.add(
            "atencao"
        );

        caixa.innerHTML =
            "⚠️ <strong>Quase no limite!</strong>" +

            "<br><br>" +

            "💰 Orçamento: " +
            moeda(limite) +

            "<br>" +

            "📊 Já utilizado: " +
            moeda(utilizado) +

            "<br>" +

            "🛒 Novo gasto: " +
            moeda(valor) +

            "<br>" +

            "🟡 Restará: " +
            moeda(restanteDepois);

        return;

    }


    caixa.innerHTML =
        "✅ <strong>Tudo certo!</strong>" +

        "<br><br>" +

        "💰 Orçamento: " +
        moeda(limite) +

        "<br>" +

        "📊 Já utilizado: " +
        moeda(utilizado) +

        "<br>" +

        "🛒 Novo gasto: " +
        moeda(valor) +

        "<br>" +

        "💚 Restará: " +
        moeda(restanteDepois);

}


function registrarGasto(event) {

    event.preventDefault();

    const descricao =
        document
            .getElementById("descricao")
            .value
            .trim();

    const valor =
        Number(
            document
                .getElementById("valor")
                .value
        );

    const categoria =
        document
            .getElementById("categoria")
            .value;

    const data =
        document
            .getElementById("data")
            .value;


    if (!descricao) {

        alert(
            "Digite a descrição do gasto."
        );

        return;

    }


    if (
        !Number.isFinite(valor) ||
        valor <= 0
    ) {

        alert(
            "Digite um valor válido."
        );

        return;

    }


    if (!categoria) {

        alert(
            "Escolha uma categoria."
        );

        return;

    }


    if (!data) {

        alert(
            "Escolha a data do gasto."
        );

        return;

    }


    const periodo =
        obterPeriodo();

    const orcamento =
        pegarOrcamento();

    const limite =
        Number(
            orcamento[categoria]
        ) || 0;

    const gastos =
        pegarGastos();

    let utilizado = 0;

    gastos.forEach(function(gasto) {

        if (
            gasto.categoria === categoria &&
            gasto.mes === periodo
        ) {

            utilizado +=
                Number(gasto.valor) || 0;

        }

    });


    if (
        limite > 0 &&
        utilizado + valor > limite
    ) {

        const excesso =
            utilizado +
            valor -
            limite;

        const continuar =
            confirm(

                "⚠️ ATENÇÃO!\n\n" +

                "Este gasto vai ultrapassar " +
                "o orçamento desta categoria.\n\n" +

                "Orçamento: " +
                moeda(limite) +

                "\nJá utilizado: " +
                moeda(utilizado) +

                "\nNovo gasto: " +
                moeda(valor) +

                "\n\nUltrapassará em: " +
                moeda(excesso) +

                "\n\nDeseja registrar mesmo assim?"

            );

        if (!continuar) {
            return;
        }

    }


    const gasto = {

        id:
            Date.now().toString() +
            Math.random()
                .toString(16)
                .slice(2),

        descricao:
            descricao,

        valor:
            valor,

        categoria:
            categoria,

        data:
            data,

        mes:
            periodo,

        criadoEm:
            new Date().toISOString()

    };


    gastos.push(gasto);

    localStorage.setItem(
        "gastos",
        JSON.stringify(gastos)
    );


    alert(
        "Gasto registrado com sucesso! 💚"
    );


    window.location.href =
        "dashboard.html";

}


colocarDataAtual();

mostrarOrcamento();

</script>

</body>
</html>
